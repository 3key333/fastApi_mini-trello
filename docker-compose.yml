services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: trello
      POSTGRES_DB: mini_trello
    ports:
      - "5433:5432"  # 5433 на хосте, чтобы не конфликтовать с локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: